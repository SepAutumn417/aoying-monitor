# Existing ACME HTTP server and renewal timer remain unchanged.
limit_req_zone $binary_remote_addr zone=aoying_login:10m rate=5r/m;
server {
    listen 443 ssl;
    server_name 64.176.50.42;
    ssl_certificate /etc/letsencrypt/live/64.176.50.42/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/64.176.50.42/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    access_log off;
    error_log /var/log/nginx/aoying-error.log crit;
    root /opt/aoying-monitor/current/web/dist;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /api/auth/login {
        limit_req zone=aoying_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location = /healthz { proxy_pass http://127.0.0.1:8000; }
    location = /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }
    location /downloads/ {
        alias /var/lib/aoying-downloads/;
        autoindex off;
    }
    location /assets/ { try_files $uri =404; expires 7d; }
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~ /\. { deny all; }
}
