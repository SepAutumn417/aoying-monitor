server {
    listen 443 ssl;
    server_name 64.176.50.42;
    ssl_certificate /etc/letsencrypt/live/64.176.50.42/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/64.176.50.42/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    # Do not log request URLs: third-party clients may put tokens in queries.
    access_log off;
    error_log /var/log/nginx/aoying-error.log crit;
    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
